apiVersion: v1
kind: ConfigMap
metadata:
  name: verify-postgres-init
data:
  init.sql: |
    CREATE DATABASE aggregator;
    CREATE DATABASE verifier;
    CREATE DATABASE bootstrap;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: verify-postgres
  labels:
    app.kubernetes.io/name: verify-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: verify-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: verify-postgres
    spec:
      containers:
        - name: postgres
          image: {{ include "ccv-cell-mp.image" .Values.verify.postgres.image | quote }}
          env:
            - name: POSTGRES_USER
              value: ccv
            - name: POSTGRES_PASSWORD
              value: ccv
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ccv"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: initdb
          configMap:
            name: verify-postgres-init
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: verify-postgres
  labels:
    app.kubernetes.io/name: verify-postgres
spec:
  selector:
    app.kubernetes.io/name: verify-postgres
  ports:
    - port: 5432
      targetPort: 5432
