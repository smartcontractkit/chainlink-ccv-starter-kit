grpcRoute:
  enabled: false

verify:
  postgres:
    image:
      registry: docker.io
      repository: library/postgres
      tag: 16-alpine
  curl:
    image:
      registry: docker.io
      repository: curlimages/curl
      tag: 8.21.0

ccv-cell:
  aggregator:
    secrets:
      app:
        type: existingSecret
        existingSecret:
          name: verify-aggregator-app
          key: secrets.toml
      config:
        type: existingSecret
        existingSecret:
          name: verify-aggregator-config
          key: config.toml

  verifier:
    evm:
      config:
        chains:
          "16015286601757825753":
            finality_depth: 0
            nodes:
              - name: node-1
                http_url: "https://ethereum-sepolia-rpc.publicnode.com"
                order: 1
    secrets:
      app:
        type: existingSecret
        existingSecret:
          name: verify-verifier-app
          key: secrets.toml
      config:
        type: existingSecret
        existingSecret:
          name: verify-verifier-config
          key: config.toml
      bootstrapConfig:
        type: existingSecret
        existingSecret:
          name: verify-verifier-bootstrap-config
          key: bootstrap-config.toml
      bootstrap:
        type: existingSecret
        keystoreBackend: postgres
        existingSecret:
          name: verify-verifier-bootstrap
          key: secrets.toml
      evm:
        # Keep inline evm config for verify; override gcpSecretStore back to values.
        type: values
