# The aggregator gRPC endpoint is always exposed through a Gateway API GRPCRoute rendered by this
# wrapper (templates/grpcroute.yaml), not by the subchart. The form supplies only the two knobs a
# user must choose; everything else assumes a standard Gateway.
grpcRoute:
  hostname: ""
  parentRefName: ""
  parentRefNamespace: ""
  parentRefSectionName: ""

# Overrides for the ccv-cell subchart: only what Marketplace forces on us.
#
# Image values are absent on purpose. For schema v2 the deployer computes them at deploy time from
# its own image location and passes them in, overriding whatever the subchart defaults to.
ccv-cell:
  aggregator:
    image:
      # Marketplace parameterizes repository/tag, and the chart rejects tag and digest together.
      digest: ""
    # Marketplace forbids charts from creating service accounts; it creates them and passes the name.
    serviceAccount:
      create: false
    secrets:
      app:
        type: gcpSecretStore

  verifier:
    image:
      digest: ""
    serviceAccount:
      create: false
    secrets:
      app:
        type: gcpSecretStore
      bootstrap:
        type: gcpSecretStore
