grpcRoute:
  enabled: true
  hostname: ""
  parentRefName: ""
  parentRefNamespace: ""
  parentRefSectionName: ""

ccv-cell:
  aggregator:
    image:
      # Marketplace parameterizes repository/tag, and the chart rejects tag and digest together.
      digest: ""
    # Marketplace forbids charts from creating service accounts, it creates them and passes the name.
    serviceAccount:
      create: false
    secrets:
      app:
        type: gcpSecretStore

  verifier:
    image:
      digest: ""
    serviceAccount:
      create: false
    secrets:
      app:
        type: gcpSecretStore
      bootstrap:
        type: gcpSecretStore
        keystoreBackend: kms
