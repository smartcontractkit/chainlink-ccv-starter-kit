{{- if .Values.grpcRoute.enabled }}
{{- $sub := index .Subcharts "ccv-cell" }}
{{- $agg := $sub.Values.aggregator }}
{{- $kind := .Values.grpcRoute.routeKind | default "GRPCRoute" }}
{{- if not (has $kind (list "GRPCRoute" "HTTPRoute")) }}
  {{- fail (printf "grpcRoute.routeKind must be GRPCRoute or HTTPRoute, got %q" $kind) }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: {{ $kind }}
metadata:
  name: {{ include "ccv-cell.aggregator.fullname" $sub }}
  labels:
    {{- include "ccv-cell.aggregator.labels" $sub | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ required "grpcRoute.parentRefName is required" .Values.grpcRoute.parentRefName }}
      {{- with .Values.grpcRoute.parentRefNamespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.grpcRoute.parentRefSectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ required "grpcRoute.hostname is required" .Values.grpcRoute.hostname | quote }}
  rules:
    {{- if eq $kind "HTTPRoute" }}
    # gRPC is HTTP/2, so a prefix match carries every /package.Service/Method path. The aggregator
    # Service sets appProtocol kubernetes.io/h2c, which is what tells a gateway to speak HTTP/2 to it.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "ccv-cell.aggregator.fullname" $sub }}
          port: {{ $agg.service.ports.grpc }}
    {{- else }}
    - backendRefs:
        - name: {{ include "ccv-cell.aggregator.fullname" $sub }}
          port: {{ $agg.service.ports.grpc }}
    {{- end }}
{{- end }}
