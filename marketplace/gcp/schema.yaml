x-google-marketplace:
  schemaVersion: v2
  applicationApiVersion: v1beta1

  publishedVersion: "$TAG"
  publishedVersionMetadata:
    releaseNote: >-
      Initial release.
    releaseTypes:
      - Feature
    recommended: false

  images:
    '':
      properties:
        ccv-cell.aggregator.image.registry:
          type: REGISTRY
        ccv-cell.aggregator.image.repository:
          type: REPO_WITHOUT_REGISTRY
        ccv-cell.aggregator.image.tag:
          type: TAG
    verifier:
      properties:
        ccv-cell.verifier.image.registry:
          type: REGISTRY
        ccv-cell.verifier.image.repository:
          type: REPO_WITHOUT_REGISTRY
        ccv-cell.verifier.image.tag:
          type: TAG

  clusterConstraints:
    k8sVersion: ">=1.19.0"
    istio:
      type: OPTIONAL
    resources:
      - replicas: 1
        requests:
          cpu: 2
          memory: 2Gi

properties:
  name:
    type: string
    x-google-marketplace:
      type: NAME
  namespace:
    type: string
    x-google-marketplace:
      type: NAMESPACE

  ccv-cell.aggregator.serviceAccount.name:
    type: string
    title: Aggregator service account
    x-google-marketplace:
      type: SERVICE_ACCOUNT
      serviceAccount:
        description: >-
          Identity of the aggregator pod. It needs no Kubernetes API access; it exists so it can be
          bound to a Google service account through Workload Identity Federation for access to
          Secret Manager and Cloud SQL.
        roles: []
  ccv-cell.verifier.serviceAccount.name:
    type: string
    title: Verifier service account
    x-google-marketplace:
      type: SERVICE_ACCOUNT
      serviceAccount:
        description: >-
          Identity of the verifier pod. It needs no Kubernetes API access; it exists so it can be
          bound to a Google service account through Workload Identity Federation for access to
          Secret Manager, Cloud KMS and Cloud SQL.
        roles: []

  ccv-cell.aggregator.secrets.app.gcpSecretStore.secretVersionResourceName:
    type: string
    title: Aggregator secrets, Secret Manager version
    description: >-
      Secret Manager version holding the aggregator secrets.toml: the `[storage]` PostgreSQL connection
      string for the aggregator database, and the `[[clients]]` credentials its verifiers authenticate
      with. e.g. projects/my-project/secrets/ccv-cell-aggregator/versions/latest
    pattern: '^projects/[^/]+/secrets/[^/]+/versions/[^/]+$'
  ccv-cell.aggregator.secrets.config.gcpSecretStore.secretVersionResourceName:
    type: string
    title: Aggregator config, Secret Manager version
    description: >-
      Secret Manager version holding the aggregator config.toml (committee, quorum, destination
      verifiers, clients). e.g. projects/my-project/secrets/ccv-cell-aggregator-config/versions/latest
    pattern: '^projects/[^/]+/secrets/[^/]+/versions/[^/]+$'
  ccv-cell.verifier.secrets.app.gcpSecretStore.secretVersionResourceName:
    type: string
    title: Verifier secrets, Secret Manager version
    description: >-
      Secret Manager version holding the verifier secrets.toml: the `[db]` PostgreSQL connection string
      for the verifier database, and the `[[aggregators]]` credentials it connects out with. e.g.
      projects/my-project/secrets/ccv-cell-verifier/versions/latest
    pattern: '^projects/[^/]+/secrets/[^/]+/versions/[^/]+$'
  ccv-cell.verifier.secrets.config.gcpSecretStore.secretVersionResourceName:
    type: string
    title: Verifier config, Secret Manager version
    description: >-
      Secret Manager version holding the verifier config.toml (aggregator addresses, committee
      verifier addresses, on-ramp and RMN remote addresses). e.g.
      projects/my-project/secrets/ccv-cell-verifier-config/versions/latest
    pattern: '^projects/[^/]+/secrets/[^/]+/versions/[^/]+$'
  ccv-cell.verifier.secrets.bootstrapConfig.gcpSecretStore.secretVersionResourceName:
    type: string
    title: Verifier bootstrap config, Secret Manager version
    description: >-
      Secret Manager version holding the verifier bootstrap-config.toml (chains, keystore mode,
      monitoring). e.g. projects/my-project/secrets/ccv-cell-verifier-bootstrap-config/versions/latest
    pattern: '^projects/[^/]+/secrets/[^/]+/versions/[^/]+$'
  ccv-cell.verifier.secrets.bootstrap.gcpSecretStore.secretVersionResourceName:
    type: string
    title: Verifier bootstrap secrets, Secret Manager version
    description: >-
      Secret Manager version holding the verifier bootstrap secrets.toml: the `[db]` PostgreSQL connection
      string for the bootstrap database, and `[keystore]`, which is the keystore password for the postgres
      backend or the key reference for the KMS backend. e.g.
      projects/my-project/secrets/ccv-cell-verifier-bootstrap/versions/latest
    pattern: '^projects/[^/]+/secrets/[^/]+/versions/[^/]+$'
  ccv-cell.verifier.secrets.evm.gcpSecretStore.secretVersionResourceName:
    type: string
    title: Verifier EVM config, Secret Manager version
    description: >-
      Secret Manager version holding the verifier evm config.toml (chain RPC endpoints and
      finality settings). e.g. projects/my-project/secrets/ccv-cell-verifier-evm/versions/latest
    pattern: '^projects/[^/]+/secrets/[^/]+/versions/[^/]+$'

  ccv-cell.verifier.config.verifier_id:
    type: string
    title: Verifier ID
    description: Unique identifier of this verifier within the committee.
  ccv-cell.verifier.config.signer_address:
    type: string
    title: Signer address
    description: >-
      On-chain address of this verifier's result-signing key. Use `auto` on a first deployment: the
      verifier generates the key on first boot and adopts its address. Set an explicit address only
      when the key already exists and you want startup to fail if it does not match.
    pattern: '^(0x[0-9a-fA-F]{40}|auto)$'

  grpcRoute.enabled:
    type: boolean
    title: Expose the aggregator through a GRPCRoute
    description: >-
      Deploy a Gateway API GRPCRoute for the aggregator gRPC endpoint. The other cells must be able to
      reach this aggregator, so leave this on unless you front it some other way. The resource kind is chosen
      below: GKE's managed Gateway implements HTTPRoute only, so pick `HTTPRoute` there; `GRPCRoute` needs a
      controller that implements it, such as Istio or Envoy Gateway.
    default: true
  grpcRoute.routeKind:
    type: string
    title: Route kind
    description: >-
      Which Gateway API resource exposes the aggregator. `GRPCRoute` is the natural fit and what most
      gateway controllers implement. `HTTPRoute` carries the same gRPC traffic with a path-prefix match,
      because gRPC is HTTP/2, and is the option to pick on **GKE's managed Gateway**, which implements
      HTTPRoute only. The aggregator Service already advertises `appProtocol: kubernetes.io/h2c`, so a
      gateway that honours it speaks HTTP/2 to the backend either way.
    default: GRPCRoute
    enum:
      - GRPCRoute
      - HTTPRoute
  grpcRoute.hostname:
    type: string
    title: Aggregator hostname
    description: >-
      Hostname the aggregator gRPC endpoint is served on, matched by the GRPCRoute. Treat as stable:
      changing it later requires updating every peer and the indexer. Ignored when the GRPCRoute is
      switched off, but still required.
  grpcRoute.parentRefName:
    type: string
    title: Gateway name
    description: >-
      Name of the Gateway API Gateway that fronts the GRPCRoute. The Gateway must terminate TLS and
      support HTTP/2 end to end for gRPC. Ignored when the GRPCRoute is switched off, but still
      required.
  grpcRoute.parentRefNamespace:
    type: string
    title: Gateway namespace
    description: Namespace of the Gateway. Leave empty if it lives in the deployment namespace.
    default: ""
  grpcRoute.parentRefSectionName:
    type: string
    title: Gateway listener (sectionName)
    description: >-
      Name of the Gateway listener to attach to. Leave empty to attach to all compatible listeners.
    default: ""

required:
  - name
  - namespace
  - ccv-cell.aggregator.secrets.app.gcpSecretStore.secretVersionResourceName
  - ccv-cell.aggregator.secrets.config.gcpSecretStore.secretVersionResourceName
  - ccv-cell.verifier.secrets.app.gcpSecretStore.secretVersionResourceName
  - ccv-cell.verifier.secrets.config.gcpSecretStore.secretVersionResourceName
  - ccv-cell.verifier.secrets.bootstrapConfig.gcpSecretStore.secretVersionResourceName
  - ccv-cell.verifier.secrets.bootstrap.gcpSecretStore.secretVersionResourceName
  - ccv-cell.verifier.secrets.evm.gcpSecretStore.secretVersionResourceName
  - ccv-cell.verifier.config.verifier_id
  - ccv-cell.verifier.config.signer_address
  - grpcRoute.hostname
  - grpcRoute.parentRefName

form:
  - widget: help
    description: >-
      <p>A CCV Cell needs external dependencies that this deployment does not create: a PostgreSQL
      cluster (Cloud SQL recommended) with three databases, <code>bootstrap</code>, <code>verifier</code>
      and <code>aggregator</code>; Secret Manager secrets holding the connection strings,
      API credentials, and application config, and Cloud KMS keys for signing. Create them before
      deploying, and bind the service accounts above to a Google service account with access to them
      through <a href="https://cloud.google.com/kubernetes-engine/docs/how-to/workload-identity">Workload
      Identity Federation for GKE</a>.</p>
      <p>All structured configuration (committee quorum, chain selectors, RPC endpoints) is supplied
      as pre-built TOML files stored in Secret Manager, referenced by the version resource names
      below. See the deployment guide for the expected format of each config secret.</p>
      <p>The aggregator gRPC endpoint is exposed through a Gateway API GRPCRoute. You must already
      have a Gateway that terminates TLS and supports HTTP/2 end to end; supply its name and the
      hostname below.</p>
