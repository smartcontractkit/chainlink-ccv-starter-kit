name: helm-ccv-cell-image-bump

on:
  repository_dispatch:
    types:
      - image-bump
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to set for aggregator and verifier (e.g. v1.2.3)'
        required: true
        type: string

concurrency:
  group: helm-ccv-cell-image-bump
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  LABEL: "ci=helm-ccv-cell-image-bump"
  VALUES: charts/ccv-cell/values.yaml
  COMPOSE: local/docker-compose.yaml
  VERSION: ${{ github.event.client_payload.tag || inputs.version }}

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Version
        run: |
          if [[ "$VERSION" != v* ]]; then
            echo "VERSION must start with 'v', got: '${VERSION}'"
            exit 1
          fi

      - name: Close stale bump PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --label "$LABEL" --json number --jq '.[].number' \
            | xargs -r -I{} gh pr close {} --comment "Superseded by a newer bump."

      - name: Install helm-docs
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2.0.1
        with:
          version: v1.14.2

      - name: Bump and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          sed -i "/^aggregator:/,/^verifier:/ s/tag: .*/tag: \"${VERSION}\"/" "$VALUES"
          sed -i "/^verifier:/,\$ s/tag: .*/tag: \"${VERSION}\"/"             "$VALUES"
          helm-docs --chart-search-root charts/ccv-cell --template-files README.md.gotmpl

          sed -i "s|\(chainlink-ccv-aggregator:\)v[0-9][0-9.]*|\1${VERSION}|" "$COMPOSE"
          sed -i "s|\(chainlink-ccv-verifier:\)v[0-9][0-9.]*|\1${VERSION}|"   "$COMPOSE"

          branch="helm-ccv-cell-image-bump/${VERSION}-${{ github.run_id }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$VALUES" charts/ccv-cell/README.md "$COMPOSE"
          git commit -m "bump ccv images to ${VERSION}"
          git push origin "$branch"

          gh pr create \
            --title "Bump ccv images to ${VERSION}" \
            --body "Bumps aggregator and verifier image tags to \`${VERSION}\` in the Helm chart and local docker-compose setup." \
            --label "$LABEL" \
            --head "$branch"
