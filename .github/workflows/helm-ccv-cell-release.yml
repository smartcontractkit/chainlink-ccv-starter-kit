name: helm-ccv-cell-release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: public.ecr.aws/chainlink
  ECR_REPO_NAMESPACE: helm
  CHART: charts/ccv-cell

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.CCV_IAM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Package & push chart
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          helm registry login --username AWS --password "$(aws ecr-public get-login-password --region "$AWS_REGION")" "$ECR_REGISTRY"

          if [ "$(yq '.dependencies // [] | length' "$CHART/Chart.yaml")" -gt 0 ]; then
            helm dependency build "$CHART"
          fi

          pkg="$(helm package "$CHART" --version "$version" -d /tmp/helm-pkg | awk '{print $NF}')"
          helm push "$pkg" "oci://$ECR_REGISTRY/$ECR_REPO_NAMESPACE"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "ccv-cell $GITHUB_REF_NAME" --generate-notes
