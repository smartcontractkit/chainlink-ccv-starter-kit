{{- if .Values.aggregator.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ccv-cell.aggregator.fullname" . }}-config
  labels:
    {{- include "ccv-cell.aggregator.labels" . | nindent 4 }}
    {{- with .Values.aggregator.configMap.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.aggregator.configMap.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  config.toml: |
{{- $cfg := deepCopy .Values.aggregator.config }}
{{- $clients := list }}
{{- range $cfg.clients }}
{{- $clients = append $clients (dict
      "clientId" .clientId
      "groups" (ternary .groups (list "default") (hasKey . "groups"))
      "enabled" (ternary .enabled true (hasKey . "enabled"))
    ) }}
{{- end }}
{{- $_ := set $cfg "clients" $clients }}
{{- range $qc := $cfg.committee.quorumConfigs }}
{{- $_ := set $qc "threshold" (int64 $qc.threshold) }}
{{- end }}
{{- include "ccv-cell.castInts" (dict "m" $cfg "keys" (list "maxMessageIDsPerBatch" "maxCommitVerifierNodeResultRequestsPerBatch")) }}
{{- include "ccv-cell.castInts" (dict "m" $cfg.server "keys" (list "maxRecvMsgSizeBytes" "maxSendMsgSizeBytes")) }}
{{- include "ccv-cell.castInts" (dict "m" $cfg.storage "keys" (list "pageSize" "maxOpenConns" "maxIdleConns")) }}
{{- include "ccv-cell.castInts" (dict "m" $cfg.aggregation "keys" (list "channelBufferSize" "backgroundWorkerCount" "maxConsecutiveErrors")) }}
{{- include "ccv-cell.castInts" (dict "m" $cfg.orphanRecovery "keys" (list "maxConsecutiveErrors" "maxOrphansPerScan" "pageSize")) }}
{{- include "ccv-cell.castInts" (dict "m" $cfg.monitoring.Beholder "keys" (list "MetricReaderInterval" "TraceBatchTimeout")) }}
{{- $_ := set $cfg.server "address" (printf "%s:%d" $cfg.server.host (int64 $cfg.server.port)) }}
{{- $_ := unset $cfg.server "host" }}
{{- $_ := unset $cfg.server "port" }}
{{- $_ := set $cfg.healthCheck "port" (toString (int64 $cfg.healthCheck.port)) }}
{{ $cfg | toToml | indent 4 }}
{{- end }}
