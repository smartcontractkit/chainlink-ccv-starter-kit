{{- if .Values.verifier.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ccv-cell.verifier.fullname" . }}-config
  labels:
    {{- include "ccv-cell.verifier.labels" . | nindent 4 }}
    {{- with .Values.verifier.configMap.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.verifier.configMap.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  bootstrap-config.toml: |
{{- $cfg := deepCopy .Values.verifier.bootstrap.config }}
{{- $_ := set $cfg "app_config_mode" "local_app_config" }}
{{- include "ccv-cell.castInts" (dict "m" $cfg.server "keys" (list "listen_port")) }}
{{- include "ccv-cell.castInts" (dict "m" $cfg.Monitoring.Beholder "keys" (list "MetricReaderInterval" "TraceBatchTimeout")) }}
{{ $cfg | toToml | indent 4 }}
  config.toml: |
{{- $vcfg := .Values.verifier.config }}
{{- $aggregators := list }}
{{- range $vcfg.aggregators }}
{{- $address := .address }}
{{- if .useInClusterAggregator }}
{{- if not $.Values.aggregator.enabled }}
{{- fail (printf "verifier.config.aggregators: %q has useInClusterAggregator: true, but aggregator.enabled is false" .name) }}
{{- end }}
{{- $address = printf "%s:%d" (include "ccv-cell.aggregator.fullname" $) (int64 $.Values.aggregator.service.ports.grpc) }}
{{- end }}
{{- $aggregators = append $aggregators (dict
      "name" .name
      "secret_name" .secret_name
      "address" $address
      "insecure_connection" (or .useInClusterAggregator (.insecure_connection | default false))
      "max_send_msg_size_bytes" (int64 (.max_send_msg_size_bytes | default 0))
      "max_recv_msg_size_bytes" (int64 (.max_recv_msg_size_bytes | default 0))
    ) }}
{{- end }}
{{ merge (dict "aggregators" $aggregators) $vcfg | toToml | indent 4 }}
{{- end }}
