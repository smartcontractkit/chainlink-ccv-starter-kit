{{- if .Values.verifier.enabled }}
{{- $appType := .Values.verifier.secrets.app.type }}
{{- if or (eq $appType "gcpSecretStore") (eq $appType "awsSecretStore") }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "ccv-cell.secretName" (dict "root" . "component" "verifier" "subComponent" "app") }}
  labels:
    {{- include "ccv-cell.verifier.labels" . | nindent 4 }}
    {{- with .Values.verifier.secrets.app.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.verifier.secrets.app.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if eq $appType "gcpSecretStore" }}
  provider: gke
  parameters:
    secrets: |
      - resourceName: {{ required "verifier.secrets.app.gcpSecretStore.secretVersionResourceName is required when verifier.secrets.app.type is gcpSecretStore" .Values.verifier.secrets.app.gcpSecretStore.secretVersionResourceName | quote }}
        path: "secrets.toml"
  {{- else }}
  provider: aws
  parameters:
    objects: |
      - objectName: {{ required "verifier.secrets.app.awsSecretStore.secretName is required when verifier.secrets.app.type is awsSecretStore" .Values.verifier.secrets.app.awsSecretStore.secretName | quote }}
        objectType: "secretsmanager"
        objectAlias: "secrets.toml"
    {{- with .Values.verifier.secrets.app.awsSecretStore.region }}
    region: {{ . | quote }}
    {{- end }}
    {{- if .Values.verifier.secrets.app.awsSecretStore.usePodIdentity }}
    usePodIdentity: "true"
    {{- end }}
  {{- end }}
---
{{- end }}
{{- $bootstrapType := .Values.verifier.secrets.bootstrap.type }}
{{- if or (eq $bootstrapType "gcpSecretStore") (eq $bootstrapType "awsSecretStore") }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "ccv-cell.secretName" (dict "root" . "component" "verifier" "subComponent" "bootstrap") }}
  labels:
    {{- include "ccv-cell.verifier.labels" . | nindent 4 }}
    {{- with .Values.verifier.secrets.bootstrap.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.verifier.secrets.bootstrap.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if eq $bootstrapType "gcpSecretStore" }}
  provider: gke
  parameters:
    secrets: |
      - resourceName: {{ required "verifier.secrets.bootstrap.gcpSecretStore.secretVersionResourceName is required when verifier.secrets.bootstrap.type is gcpSecretStore" .Values.verifier.secrets.bootstrap.gcpSecretStore.secretVersionResourceName | quote }}
        path: "secrets.toml"
  {{- else }}
  provider: aws
  parameters:
    objects: |
      - objectName: {{ required "verifier.secrets.bootstrap.awsSecretStore.secretName is required when verifier.secrets.bootstrap.type is awsSecretStore" .Values.verifier.secrets.bootstrap.awsSecretStore.secretName | quote }}
        objectType: "secretsmanager"
        objectAlias: "secrets.toml"
    {{- with .Values.verifier.secrets.bootstrap.awsSecretStore.region }}
    region: {{ . | quote }}
    {{- end }}
    {{- if .Values.verifier.secrets.bootstrap.awsSecretStore.usePodIdentity }}
    usePodIdentity: "true"
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
