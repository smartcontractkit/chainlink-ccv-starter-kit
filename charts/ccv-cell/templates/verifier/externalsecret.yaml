{{- if .Values.verifier.enabled }}
{{- if eq .Values.verifier.secrets.app.type "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ccv-cell.secretName" (dict "root" . "component" "verifier" "subComponent" "app") }}
  labels:
    {{- include "ccv-cell.verifier.labels" . | nindent 4 }}
    {{- with .Values.verifier.secrets.app.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.verifier.secrets.app.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    {{- toYaml .Values.verifier.secrets.app.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "ccv-cell.secretName" (dict "root" . "component" "verifier" "subComponent" "app") }}
    template:
      engineVersion: v2
      data:
        secrets.toml: |
          [db]
          url = "{{ `{{ .db_url }}` }}"

          {{- range $i, $aggregator := .Values.verifier.config.aggregators }}
          [[aggregators]]
          secret_name = {{ $aggregator.secret_name | quote }}
          api_key = {{ print `{{ ` (printf ".aggregator_api_key_%d" $i) ` }}` | quote }}
          secret_key = {{ print `{{ ` (printf ".aggregator_secret_key_%d" $i) ` }}` | quote }}
          {{- end }}
  data:
    - secretKey: db_url
      remoteRef:
        {{- toYaml .Values.verifier.secrets.app.externalSecret.dbUrlRemoteRef | nindent 8 }}
    {{- range $i, $aggregator := .Values.verifier.config.aggregators }}
    {{- if empty $aggregator.apiKeyRemoteRef }}
    {{- fail (printf "verifier.config.aggregators: %q has secrets.app.type: externalSecret but no apiKeyRemoteRef" $aggregator.name) }}
    {{- end }}
    {{- if empty $aggregator.secretKeyRemoteRef }}
    {{- fail (printf "verifier.config.aggregators: %q has secrets.app.type: externalSecret but no secretKeyRemoteRef" $aggregator.name) }}
    {{- end }}
    - secretKey: {{ printf "aggregator_api_key_%d" $i }}
      remoteRef:
        {{- toYaml $aggregator.apiKeyRemoteRef | nindent 8 }}
    - secretKey: {{ printf "aggregator_secret_key_%d" $i }}
      remoteRef:
        {{- toYaml $aggregator.secretKeyRemoteRef | nindent 8 }}
    {{- end }}
---
{{- end }}
{{- if eq .Values.verifier.secrets.bootstrap.type "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ccv-cell.secretName" (dict "root" . "component" "verifier" "subComponent" "bootstrap") }}
  labels:
    {{- include "ccv-cell.verifier.labels" . | nindent 4 }}
    {{- with .Values.verifier.secrets.bootstrap.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.verifier.secrets.bootstrap.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    {{- toYaml .Values.verifier.secrets.bootstrap.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "ccv-cell.secretName" (dict "root" . "component" "verifier" "subComponent" "bootstrap") }}
    template:
      engineVersion: v2
      data:
        secrets.toml: |
          [db]
          url = "{{ `{{ .db_url }}` }}"

          [keystore]
          backend = {{ .Values.verifier.secrets.bootstrap.keystoreBackend | quote }}

          {{- if eq .Values.verifier.secrets.bootstrap.keystoreBackend "postgres" }}
          password = "{{ `{{ .keystore_password }}` }}"
          {{- else if eq .Values.verifier.secrets.bootstrap.keystoreBackend "kms" }}
          [keystore.kms]
          provider = {{ required "verifier.secrets.bootstrap.kms.provider is required when keystoreBackend is kms (aws or gcp)" .Values.verifier.secrets.bootstrap.kms.provider | quote }}
          ecdsa_key_id = {{ .Values.verifier.secrets.bootstrap.kms.ecdsaKeyId | quote }}
          {{- with .Values.verifier.secrets.bootstrap.kms.ed25519KeyId }}
          ed25519_key_id = {{ . | quote }}
          {{- end }}
          {{- else }}
            {{- fail (print "Storage backend '" .Values.verifier.secrets.bootstrap.keystoreBackend "' is invalid") }}
          {{- end }}

  data:
    - secretKey: db_url
      remoteRef:
        {{- toYaml .Values.verifier.secrets.bootstrap.externalSecret.dbUrlRemoteRef | nindent 8 }}
    {{- if eq .Values.verifier.secrets.bootstrap.keystoreBackend "postgres" }}
    - secretKey: keystore_password
      remoteRef:
        {{- toYaml .Values.verifier.secrets.bootstrap.externalSecret.keystorePasswordRemoteRef | nindent 8 }}
    {{- end }}
---
{{- end }}
{{- if eq .Values.verifier.secrets.evm.type "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ccv-cell.secretName" (dict "root" . "component" "verifier" "subComponent" "evm") }}
  labels:
    {{- include "ccv-cell.verifier.labels" . | nindent 4 }}
    {{- with .Values.verifier.secrets.evm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.verifier.secrets.evm.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    {{- toYaml .Values.verifier.secrets.evm.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "ccv-cell.secretName" (dict "root" . "component" "verifier" "subComponent" "evm") }}
    template:
      engineVersion: v2
      data:
        secrets.toml: |
          {{- range $sel, $chain := .Values.verifier.evm.config.chains }}
          [chains.{{ $sel | quote }}]
          finality_depth = {{ int64 $chain.finality_depth }}
          {{- with $chain.txm_block_time }}
          txm_block_time = {{ . | quote }}
          {{- end }}
          {{- range $j, $node := $chain.nodes }}

          [[chains.{{ $sel | quote }}.nodes]]
          name = {{ $node.name | quote }}
          http_url = {{ print `{{ ` (printf ".chain_%s_node_%d_http_url" $sel $j) ` }}` | quote }}
          {{- if $node.wsUrlRemoteRef }}
          ws_url = {{ print `{{ ` (printf ".chain_%s_node_%d_ws_url" $sel $j) ` }}` | quote }}
          {{- else }}
          ws_url = ""
          {{- end }}
          order = {{ int64 ($node.order | default 0) }}
          {{- end }}
          {{- end }}
  data:
    {{- range $sel, $chain := .Values.verifier.evm.config.chains }}
    {{- range $j, $node := $chain.nodes }}
    {{- if empty $node.httpUrlRemoteRef }}
    {{- fail (printf "verifier.evm.config.chains[%q].nodes[%d] (%s): has secrets.evm.type: externalSecret but no httpUrlRemoteRef" $sel $j $node.name) }}
    {{- end }}
    - secretKey: {{ printf "chain_%s_node_%d_http_url" $sel $j }}
      remoteRef:
        {{- toYaml $node.httpUrlRemoteRef | nindent 8 }}
    {{- if $node.wsUrlRemoteRef }}
    - secretKey: {{ printf "chain_%s_node_%d_ws_url" $sel $j }}
      remoteRef:
        {{- toYaml $node.wsUrlRemoteRef | nindent 8 }}
    {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
