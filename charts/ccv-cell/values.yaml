global:
  image:
    # -- Default OCI registry for all images; overridden per-component by setting `image.registry`.
    registry: public.ecr.aws
  # -- Image pull secrets to add to every pod. See [imagePullSecrets](https://kubernetes.io/docs/concepts/containers/images/#specifying-imagepullsecrets-on-a-pod).
  imagePullSecrets: []
  # -- Labels added to every resource created by this chart.
  labels: {}

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the fully-qualified resource name.
fullnameOverride: ""

aggregator:
  # -- Enable the aggregator component.
  enabled: true

  image:
    # -- OCI registry, overrides `global.image.registry` when set.
    registry: ""
    # -- Image repository.
    repository: chainlink/chainlink-ccv-aggregator
    # -- Image tag. Mutually exclusive with `digest`.
    #    All tags in the default repository are immutable.
    tag: "v0.10.0"
    # -- Image digest (`sha256:...`). Mutually exclusive with `tag`.
    digest: ""
    # -- Image pull policy. See [imagePullPolicy](https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy).
    pullPolicy: IfNotPresent

  # This tree is rendered into `config.toml` with `toToml` (see templates/aggregator/configmap.yaml).
  #
  # `server.address` is not set here: it's computed from `server.host` and `server.port` below.
  # This determines the container's bind address. The Service's exposed port is separate: `aggregator.service.ports.grpc`.
  config:
    # -- Unique identifier for this aggregator instance. An empty value defaults to the pod's hostname,
    #    which is already stable and unique per replica.
    aggregatorID: ""

    # -- Path to a generated config file merged over this one. Rarely needed.
    generatedConfigPath: ""

    # -- Pyroscope server URL for continuous profiling. An empty value disables it.
    pyroscope_url: ""

    # -- Maximum message IDs per batch request, from 1 to 1000.
    maxMessageIDsPerBatch: 100

    # -- Maximum verifier-result requests per batch, from 1 to 1000.
    maxCommitVerifierNodeResultRequestsPerBatch: 100

    # -- Signer quorums and destination verifiers this aggregator trusts.
    #    Hard requirement: the aggregator refuses to start without at least one entry in both `quorumConfigs` and `destinationVerifiers`.
    #    without at least one entry in both `quorumConfigs` and `destinationVerifiers`.
    committee:
      # -- Quorum config per source chain selector. Note: the map keys must be strings, wrapped in quotes.
      quorumConfigs: {}
      # "1":
      #   sourceVerifierAddress: "0x00000000000000000000000000000000000000a1"
      #   threshold: 1
      #   signers:
      #     - address: "0x00000000000000000000000000000000000000b1"

      # -- Destination verifier contract address per destination chain selector.
      #    Note: the map keys must be strings, wrapped in quotes.
      destinationVerifiers: {}
      # "2": "0x00000000000000000000000000000000000000c2"

    server:
      # -- Port the gRPC server listens on.
      port: 50051
      # -- Host the gRPC server binds to. Leave empty to bind all interfaces, which is almost always
      #    what you want in a container.
      host: ""
      # -- Maximum duration for any gRPC request.
      requestTimeout: "10s"
      # -- Timeout for connection establishment. Empty uses the gRPC default (no timeout).
      connectionTimeout: "0s"
      # -- Minimum time between client pings. Empty uses the gRPC default (5m).
      keepaliveMinTime: "0s"
      # -- Time after which the server pings idle clients. Empty uses the gRPC default (2h).
      keepaliveTime: "0s"
      # -- Timeout for a ping ack before closing the connection. Empty uses the gRPC default (20s).
      keepaliveTimeout: "0s"
      # -- Forces connections closed after this duration. Empty uses the gRPC default (no limit).
      maxConnectionAge: "0s"
      # -- Maximum message size the server can receive, in bytes. 0 uses the default (4MB).
      maxRecvMsgSizeBytes: 0
      # -- Maximum message size the server can send, in bytes. 0 uses the default (4MB).
      maxSendMsgSizeBytes: 0

    storage:
      # -- Storage backend. Only `postgres` is supported.
      type: postgres
      # -- Records fetched per page in paginated queries.
      pageSize: 100
      # -- Maximum open database connections.
      maxOpenConns: 25
      # -- Maximum idle database connections.
      maxIdleConns: 5
      # -- Maximum lifetime of a database connection.
      connMaxLifetime: "1h0m0s"
      # -- Maximum time a database connection may sit idle before it's closed.
      connMaxIdleTime: "5m0s"
      # -- Timeout for a single database query.
      queryTimeout: "10s"

    # -- Authenticated API clients. Both are chart-only fields, not written to `config.toml`.
    #    `api_key` must be a UUID, `secret_key` must be hex-encoded:
    #    the aggregator rejects other formats at startup.
    clients: []
    # - clientId: client-1
    #   groups: ["default"]
    #   enabled: true
    #   # `apiKeyRemoteRef` and `secretKeyRemoteRef` are used only when `aggregator.secrets.app.type` is `externalSecret`.
    #   # They tell the ExternalSecret where to fetch the matching API key/secret key for this same `clientId`.
    #   # Omit if `aggregator.secrets.app.type` is not `externalSecret`.
    #   apiKeyRemoteRef:
    #     key: /some/path/for/client-1-api
    #   secretKeyRemoteRef:
    #     key: /some/path/for/client-1-secret

    aggregation:
      # -- Buffer size of the aggregation request channel.
      channelBufferSize: 200
      # -- Number of background workers processing aggregation requests.
      backgroundWorkerCount: 10
      # -- Timeout for each aggregation operation. 0 disables the timeout.
      operationTimeout: "0s"
      # -- How long shutdown waits for in-flight aggregation workers before proceeding anyway.
      drainTimeout: "10s"
      # -- Maximum consecutive errors before aggregation is considered failed. 0 disables the check.
      maxConsecutiveErrors: 0

    messageDisablementRules:
      # -- How often the in-memory message-disablement registry refreshes from the database.
      refreshInterval: "30s"

    orphanRecovery:
      # -- Enable recovery of orphaned aggregation records.
      #    This can happen if there is a pod crash mid-report build, and is recommended to be left enabled.
      enabled: true
      # -- How often orphan recovery runs.
      interval: "5m0s"
      # -- Timeout for each check-aggregation operation.
      checkAggregationTimeout: "5s"
      # -- Maximum age of orphan records to consider for recovery. Older records are skipped.
      maxAge: "168h0m0s"
      # -- Timeout for each orphan recovery scan.
      scanTimeout: "4m0s"
      # -- Maximum consecutive errors before orphan recovery is considered failed.
      maxConsecutiveErrors: 3
      # -- Maximum orphans processed per scan cycle.
      maxOrphansPerScan: 10000
      # -- Orphaned keys fetched per database page during a scan.
      pageSize: 100

    heartbeat:
      # -- Heartbeat storage backend: `memory` or `redis`.
      storeType: memory

    rateLimiting:
      # -- Enable rate limiting.
      enabled: false
      storage:
        # -- Rate-limit storage backend: `memory` or `redis`.
        type: memory

    healthCheck:
      # -- Enable the health-check HTTP server. This chart's liveness/readiness probes require it; do
      #    not disable it unless you replace those probes too.
      enabled: true
      # -- Port the health-check HTTP server listens on.
      port: 8080

    monitoring:
      # -- Log level for the service logger.
      LogLevel: info
      Pyroscope:
        # -- Enable Pyroscope telemetry.
        Enabled: false
        # -- Remote endpoint of the Pyroscope service.
        URL: ""
      Beholder:
        # -- Enable Beholder telemetry.
        Enabled: false
        # -- Disable TLS for the Beholder client.
        InsecureConnection: false
        # -- Path to the CA certificate file for the Beholder client.
        CACertFile: ""
        # -- gRPC endpoint for the Beholder client to send data to the collector.
        OtelExporterGRPCEndpoint: ""
        # -- HTTP endpoint for the Beholder client to send data to the collector.
        OtelExporterHTTPEndpoint: ""
        # -- Enable log streaming to the collector.
        LogStreamingEnabled: false
        # -- Minimum log level to stream to Beholder.
        LogStreamingLevel: info
        # -- Interval to scrape metrics, in seconds.
        MetricReaderInterval: 0
        # -- Ratio of traces to sample.
        TraceSampleRatio: 0.0
        # -- Timeout for a batch of traces.
        TraceBatchTimeout: 0

  configMap:
    # -- Annotations to add to the aggregator ConfigMap.
    annotations: {}
    # -- Labels to add to the aggregator ConfigMap.
    labels: {}


  secrets:
    app:
      # -- Annotations to add to the aggregator app Secret.
      annotations: {}
      # -- Labels to add to the aggregator app Secret.
      labels: {}

      # -- Secret provisioning strategy: `externalSecret`, `existingSecret`, `gcpSecretStore`, `awsSecretStore`, or `azureKeyVault`.
      #    Configure the values below for the chosen type.
      type: externalSecret

      existingSecret:
        # -- Name of an existing Kubernetes Secret to use as the app secret.
        name: ""
        # -- Key inside the existing Secret that holds the secrets file.
        key: "secrets.toml"

      externalSecret:
        # -- Name of the ExternalSecret resource to create.
        name: ""
        # -- SecretStore reference for the ExternalSecret.
        #    See [SecretStoreRef](https://external-secrets.io/latest/api/spec/#external-secrets.io/v1.SecretStoreRef).
        secretStoreRef:
          name: ""
          kind: ClusterSecretStore

        # -- RemoteRef for the storage URL secret.
        #    See [RemoteRef](https://external-secrets.io/latest/api/spec/#external-secrets.io/v1.ExternalSecretDataRemoteRef).
        storageUrlRemoteRef: {}
          # key: /some/path/for/storage-url/

      # -- GCP Secret Manager, mounted via the [Secret Manager add-on for the Secrets Store CSI Driver](https://docs.cloud.google.com/secret-manager/docs/secret-manager-managed-csi-component).
      #    Requires the add-on enabled on the GKE cluster and Workload Identity Federation configured for `aggregator.serviceAccount` as described in
      #    [Configure Workload Identity](https://docs.cloud.google.com/secret-manager/docs/secret-manager-managed-csi-component#configure-workload-identity).
      gcpSecretStore:
        secretProviderClass:
          # -- Name of the SecretProviderClass resource to create.
          name: ""
        # -- Fully-qualified GCP Secret Manager secret version resource name, e.g. `projects/<project>/secrets/<secret>/versions/latest`.
        secretVersionResourceName: ""

      # -- AWS Secrets Manager, mounted via the [AWS Secrets and Configuration Provider (ASCP)](https://github.com/aws/secrets-store-csi-driver-provider-aws)
      #    for the Secrets Store CSI Driver. Requires the ASCP installed on the cluster and either
      #    IRSA or EKS Pod Identity configured for `aggregator.serviceAccount`.
      #    For IRSA: annotate the ServiceAccount with `eks.amazonaws.com/role-arn`.
      #    For EKS Pod Identity: create a Pod Identity association via the EKS console/CLI; set `usePodIdentity: true`.
      awsSecretStore:
        secretProviderClass:
          # -- Name of the SecretProviderClass resource to create.
          name: ""
        # -- AWS Secrets Manager secret name or full ARN holding the pre-built `secrets.toml`.
        secretName: ""
        # -- AWS region where the secret lives. If omitted, the ASCP infers it from the node's
        #    `topology.kubernetes.io/region` label (adds per-mount overhead on large clusters).
        region: ""
        # -- Set to `true` to use EKS Pod Identity instead of IRSA for AWS credential retrieval.
        usePodIdentity: false

      # -- Azure Key Vault, mounted via the [Azure Key Vault provider for the Secrets Store CSI Driver](https://azure.github.io/secrets-store-csi-driver-provider-azure/).
      #    Requires the provider installed on the AKS cluster and either
      #    Workload Identity or Azure AD Pod Identity configured for `aggregator.serviceAccount`.
      #    For Workload Identity: annotate the ServiceAccount with `azure.workload.identity/client-id` and set `clientId` below.
      #    For Pod Identity: create an AzureIdentityBinding and set `usePodIdentity: true`.
      #    Note: Workload Identity also requires the `azure.workload.identity/use: "true"` pod label, set via `aggregator.podLabels`.
      azureKeyVault:
        secretProviderClass:
          # -- Name of the SecretProviderClass resource to create.
          name: ""
        # -- Azure Key Vault name (the short name, not the full URI).
        keyvaultName: ""
        # -- Name of the Key Vault secret holding the pre-built `secrets.toml`.
        secretName: ""
        # -- Azure AD tenant ID where the Key Vault lives.
        tenantId: ""
        # -- Client ID of the Azure AD application or user-assigned managed identity to use for Workload Identity.
        #    Leave empty when using Pod Identity (`usePodIdentity: true`).
        clientId: ""
        # -- Set to `true` to use Azure AD Pod Identity instead of Workload Identity for credential retrieval.
        usePodIdentity: false

  # -- Override the container entrypoint. See [command](https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/).
  command: []
  # - /bin/aggregator

  # -- Arguments passed to the container entrypoint. See [args](https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/).
  args: []
  # - --config=/etc/config.toml

  # -- Container lifecycle hooks (postStart / preStop). See [lifecycle](https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/).
  lifecycle: {}
  # preStop:
  #   exec:
  #     command: ["/bin/sh", "-c", "sleep 5"]

  # -- Extra environment variables for the aggregator container. See [env](https://kubernetes.io/docs/tasks/inject-data-application/define-environment-variable-container/).
  env: []

  # -- Extra envFrom sources (ConfigMaps / Secrets) for the aggregator container. See [envFrom](https://kubernetes.io/docs/tasks/inject-data-application/define-environment-variable-container/).
  envFrom: []

  # -- Init containers prepended to the aggregator pod. See [init containers](https://kubernetes.io/docs/concepts/workloads/pods/init-containers/).
  extraInitContainers: []
  # - name: init
  #   image: busybox

  # -- Sidecar containers appended to the aggregator pod. See [sidecar containers](https://kubernetes.io/docs/concepts/workloads/pods/#pod-templates).
  extraContainers: []
  # - name: sidecar
  #   image: busybox

  serviceAccount:
    # -- Create a dedicated ServiceAccount for the aggregator.
    create: true
    # -- Annotations to add to the ServiceAccount.
    #    For GKE Workload Identity Federation (required by `aggregator.secrets.app.gcpSecretStore`),
    #    set `iam.gke.io/gcp-service-account` to the Google service account bound to this KSA.
    #    For AWS IRSA (required by `aggregator.secrets.app.awsSecretStore` with `usePodIdentity: false`),
    #    set `eks.amazonaws.com/role-arn` to the IAM role ARN that can read the secret.
    #    For Azure Workload Identity (required by `aggregator.secrets.app.azureKeyVault` with `usePodIdentity: false`),
    #    set `azure.workload.identity/client-id` to the Azure AD application or managed identity client ID.
    annotations: {}
    # -- Labels to add to the ServiceAccount.
    labels: {}
    # -- Use an existing ServiceAccount instead of creating one; ignored when `create` is true.
    name: ""
    # -- Mount the service account token into pods. See [automountServiceAccountToken](https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/#opt-out-of-api-credential-automounting).
    #    By default, not needed, since this application doesn't use the Kuberentes API.
    automountServiceAccountToken: false

  # -- Annotations to add to the aggregator Deployment object.
  annotations: {}
  # -- Labels to add to the aggregator Deployment object.
  labels: {}

  # -- Annotations to add to the aggregator pods.
  podAnnotations: {}
  # -- Labels to add to the aggregator pods.
  podLabels: {}

  service:
    # -- Service type. See [Service types](https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types).
    type: ClusterIP
    # -- Static ClusterIP to assign to the Service. Leave empty to let Kubernetes allocate one.
    clusterIP: ""
    # -- Annotations to add to the aggregator Service.
    annotations: {}
    # -- Labels to add to the aggregator Service.
    labels: {}
    ports:
      # -- Port for the gRPC endpoint.
      grpc: 50051
      # -- Port for the health endpoint.
      health: 8080

  ingress:
    # -- Enable an Ingress for the aggregator gRPC endpoint.
    enabled: false

    # -- Ingress class name. See [Ingress](https://kubernetes.io/docs/concepts/services-networking/ingress/).
    #    Make sure that the endpoint is served under TLS with HTTP/2 end-to-end and with gRPC support. Some controllers
    #    require annotations, while others support it out of the box.
    className: ""

    # -- Annotations to add to the Ingress (e.g. controller-specific TLS/HTTP2 or gRPC wiring).
    annotations: {}
    # -- Labels to add to the Ingress.
    labels: {}

    # -- Hostname for the aggregator. Treat as stable, changing it requires updating every peer and the indexer.
    host: "your-ccv-aggregator.example.com"

    tls:
      # -- Enable TLS for the Ingress.
      enabled: false
      # -- Name of the TLS Secret.
      secretName: ""

  grpcRoute:
    # -- Enable a Gateway API GRPCRoute for the aggregator gRPC endpoint. **Preferred over `httpRoute`** when your
    #    gateway controller supports it. Mutually independent of `ingress.enabled` and `httpRoute.enabled`.
    enabled: false

    # -- Annotations to add to the GRPCRoute.
    annotations: {}
    # -- Labels to add to the GRPCRoute.
    labels: {}

    # -- Parent Gateway references. See [Gateway API](https://kubernetes.io/docs/concepts/services-networking/gateway/#api-kind-grpcroute).
    #    Make sure that the endpoint is served under TLS with HTTP/2 end-to-end and with gRPC support. Some controllers
    #    require annotations, while others support it out of the box.
    parentRefs: []
    # - group: gateway.networking.k8s.io
    #   kind: Gateway
    #   name: gateway
    #   namespace: istio-ingress
    #   sectionName: https

    # -- Hostnames to match. See [Gateway API](https://kubernetes.io/docs/concepts/services-networking/gateway/#api-kind-grpcroute).
    #    Treat as stable, changing it requires updating every peer and the indexer.
    hostnames: []
    # - your-ccv-aggregator.example.com

  httpRoute:
    # -- Enable a Gateway API HTTPRoute for the aggregator gRPC endpoint. Only needed as a fallback when your gateway
    #    controller doesn't yet support GRPCRoute (see `grpcRoute` above, which is preferred for gRPC traffic when
    #    available). Mutually independent of `ingress.enabled` and `grpcRoute.enabled`.
    enabled: false

    # -- Annotations to add to the HTTPRoute.
    annotations: {}
    # -- Labels to add to the HTTPRoute.
    labels: {}

    # -- Parent Gateway references. See [Gateway API](https://kubernetes.io/docs/concepts/services-networking/gateway/#api-kind-httproute).
    #    Make sure that the endpoint is served under TLS with HTTP/2 end-to-end and with gRPC support. Some controllers
    #    require annotations, while others support it out of the box.
    parentRefs: []
    # - group: gateway.networking.k8s.io
    #   kind: Gateway
    #   name: gateway
    #   namespace: istio-ingress
    #   sectionName: https

    # -- Hostnames to match. See [Gateway API](https://kubernetes.io/docs/concepts/services-networking/gateway/#api-kind-httproute).
    #    Treat as stable, changing it requires updating every peer and the indexer.
    hostnames: []
    # - your-ccv-aggregator.example.com

  networkPolicy:
    # -- Enable a NetworkPolicy for the aggregator. See [NetworkPolicy](https://kubernetes.io/docs/concepts/services-networking/network-policies/).
    enabled: false

    # -- Annotations to add to the NetworkPolicy.
    annotations: {}

    # -- Labels to add to the NetworkPolicy.
    labels: {}

    # -- Ingress rules for the NetworkPolicy. When enabled, add a rule allowing traffic from your ingress/gateway controller.
    #    Each rule's `ports` defaults to the aggregator's own ports when omitted.
    #    See [NetworkPolicy](https://kubernetes.io/docs/concepts/services-networking/network-policies/).
    ingress:
      - from:
          - podSelector: {}

  # -- CPU/memory resource requests and limits for the aggregator container. See [resources](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/).
  resources: {}
    # limits:
    #   cpu: 1500m
    #   memory: 1Gi
    # requests:
    #   cpu: 1
    #   memory: 512Mi

  # -- CPU/memory resource requests and limits for the entire pod. See [resources](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/).
  podResources: {}
    # limits:
    #   cpu: 2
    #   memory: 2Gi
    # requests:
    #   cpu: 1
    #   memory: 1Gi

  # -- Liveness probe for the aggregator container. See [probes](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/).
  livenessProbe:
    httpGet:
      path: /health/live
      port: health
    initialDelaySeconds: 15
    periodSeconds: 15
    failureThreshold: 10

  # -- Readiness probe for the aggregator container. See [probes](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/).
  readinessProbe:
    httpGet:
      path: /health/ready
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10

  # -- Startup probe for the aggregator container. See [probes](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/).
  startupProbe:
    # httpGet:
    #   path: /health/ready
    #   port: health
    # initialDelaySeconds: 5
    # periodSeconds: 5
    # failureThreshold: 20

  # -- Extra volumes appended to the aggregator pod. See [volumes](https://kubernetes.io/docs/tasks/configure-pod-container/configure-volume-storage/).
  extraVolumes: []
  # - name: extra-ca-bundle
  #   configMap:
  #     name: extra-ca-bundle

  # -- Extra volume mounts appended to the aggregator container. See [volumes](https://kubernetes.io/docs/tasks/configure-pod-container/configure-volume-storage/).
  extraVolumeMounts: []
  # - name: extra-ca-bundle
  #   mountPath: /etc/ssl/certs/extra-ca.pem
  #   subPath: extra-ca.pem
  #   readOnly: true

  # -- Node selector for pod scheduling. See [nodeSelector](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector).
  nodeSelector: {}
  # -- Tolerations for pod scheduling. See [tolerations](https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/).
  tolerations: []
  # -- Affinity rules for pod scheduling. See [affinity](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity).
  affinity: {}

  # -- Security context applied at the pod level. See [podSecurityContext](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/).
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  # -- Security context applied at the container level. See [securityContext](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/).
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # -- Share a single process namespace across all containers in the pod. See [shareProcessNamespace](https://kubernetes.io/docs/tasks/configure-pod-container/share-process-namespace/).
  shareProcessNamespace: false

verifier:
  # -- Enable the verifier component.
  enabled: true

  image:
    # -- OCI registry; overrides `global.image.registry` when set.
    registry: ""
    # -- Image repository.
    repository: chainlink/chainlink-ccv-verifier
    # -- Image tag. Mutually exclusive with `digest`.
    #    All tags in the default repository are immutable.
    tag: "v0.10.0"
    # -- Image digest (`sha256:...`). Mutually exclusive with `tag`.
    digest: ""
    # -- Image pull policy. See [imagePullPolicy](https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy).
    pullPolicy: IfNotPresent

  # This tree is rendered into `config.toml` with `toToml` (see templates/verifier/configmap.yaml).
  config:
    # -- Unique identifier for this committee verifier instance. Set a different value for each verifier
    #    in the committee.
    verifier_id: ""

    # -- Go duration string for the message-disablement-rules poll interval (e.g. `"2s"`). Empty uses the
    #    integration default.
    message_disablement_rules_poll_interval: "2s"

    # -- Go duration string for the message-disablement-rules RPC timeout (e.g. `"500ms"`). Empty uses the
    #    integration default.
    message_disablement_rules_client_timeout: "500ms"

    # -- On-chain address of this verifier's result-signing key. Each verifier will have a different address.
    #    The default, "auto", infers the address from the key. You can see the resulting address in the startup logs
    #    or the bootstrap info endpoint: /keystore/reader/getaddresses, to use it in the Aggregator's committee, or to
    #    pass to other cells.
    signer_address: "auto"

    # -- Pyroscope server URL for continuous profiling. An empty value disables it.
    pyroscope_url: ""

    # -- Chain selectors, as strings, for which to disable the finality violation checker.
    disable_finality_checkers: []

    # -- Aggregators that this verifier writes to.
    #    Set `useInClusterAggregator: true` to use the aggregator this chart release deploys, or set
    #    `address` for any other aggregator. `api_key` must be a UUID, `secret_key` must
    #    be hex-encoded, matching the target aggregator's config for this client.
    aggregators: []
    # - name: aggregator-1
    #   secret_name: aggregator_1
    #   useInClusterAggregator: true
    #   insecure_connection: false
    #   max_send_msg_size_bytes: 4194304
    #   max_recv_msg_size_bytes: 4194304
    #   # `apiKeyRemoteRef` and `secretKeyRemoteRef` are used only when `verifier.secrets.app.type` is `externalSecret`.
    #   # They tell the ExternalSecret where to fetch the matching API key/secret key for this same `clientId`.
    #   # Omit if `verifier.secrets.app.type` is not `externalSecret`.
    #   apiKeyRemoteRef:
    #     key: /some/path/for/aggregator-1-api
    #   secretKeyRemoteRef:
    #     key: /some/path/for/aggregator-1-secret
    # - name: aggregator-2
    #   secret_name: aggregator_2
    #   address: "aggregator-2.example.com:50051"
    #   apiKeyRemoteRef:
    #     key: /some/path/for/aggregator-2-api
    #   secretKeyRemoteRef:
    #     key: /some/path/for/aggregator-2-secret
    #   insecure_connection: false

    # -- Addresses of the committee verifiers, one per chain selector. Paired with `on_ramp_addresses`:
    #    at least one chain needs both, or the verifier fails to start ("no enabled/initialized chain
    #    sources").
    #    Note: the map keys must be strings, wrapped in quotes.
    committee_verifier_addresses: {}
    # "1": "0x00000000000000000000000000000000000000c1"

    # -- Addresses of the default executor on-ramps, one per chain selector. Messages naming the default
    #    executor are verified even if they don't name this committee verifier.
    #    Note: the map keys must be strings, wrapped in quotes.
    default_executor_on_ramp_addresses: {}
    # "1": "0x00000000000000000000000000000000000000e1"

    # -- Addresses of the on-ramps, one per chain selector. Paired with `committee_verifier_addresses`
    #    above — see that field.
    #    Note: the map keys must be strings, wrapped in quotes.
    on_ramp_addresses: {}
    # "1": "0x00000000000000000000000000000000000000a1"

    # -- Addresses of the RMN Remote contracts, one per chain selector. Required for curse detection.
    #    Note: the map keys must be strings, wrapped in quotes.
    rmn_remote_addresses: {}
    # "1": "0x00000000000000000000000000000000000000b1"

    # -- Optional custom policy endpoint consulted as the final gate before signing.
    #    Absent by default; the verifier behaves as if this section does not exist when omitted.
    #    You can deploy these as sidecars (see verifier.extraContainers), but more likely you'll want a separate
    #    deployment entirely.
    #    See https://github.com/smartcontractkit/chainlink-ccv/blob/main/verifier/docs/policy_hook.md for more info
    # policy_hook:
    #   # Root URL the verifier POSTs to (`base_url + "/v1/evaluate"`). Must be https unless `insecure_connection` is set.
    #   base_url: "https://policy.example.com"
    #   # Timeout for a single call to the endpoint, as a Go duration string. Empty uses the 5s default (15s max).
    #   request_timeout: "5s"
    #   # Wait between retries after an endpoint error, as a Go duration string. Jittered 0.5x-1.5x. Empty uses 10s.
    #   retry_delay: "10s"
    #   # Allow a plain http:// endpoint. For local/test use only.
    #   insecure_connection: false
    #   # Make a missing endpoint credential fatal at startup instead of calling unauthenticated.
    #   require_auth: false

  bootstrap:
    # This tree is rendered into `bootstrap-config.toml` with `toToml` (see templates/verifier/configmap.yaml).
    config:
      # -- Path to the verifier config file for local mode. This file holds the verifier config,
      #    not the bootstrap config.
      local_app_config_path: /etc/committee-verifier/config.toml

      server:
        # -- Port for the bootstrap HTTP server.
        listen_port: 9988

      # -- List of chains where this node has a signing identity.
      chains: []
      # - type: EVM
      #   id: "1"

      # Adds an existing Chainlink node key to the keystore instead of generating one. Set only when
      # migrating an operator off CL mode; requires `expected_id`.
      # key_import:
      #   path: /etc/ccv/migration/key.json
      #   password_path: /etc/ccv/migration/export-password.txt
      #   expected_id: "0x0123456789abcdef0123456789abcdef01234567"

      Monitoring:
        # -- Log level for the service logger.
        LogLevel: info

        Pyroscope:
          # -- Enable Pyroscope telemetry.
          Enabled: false
          # -- Remote endpoint of the Pyroscope service.
          URL: "http://pyroscope:4040"

        Beholder:
          # -- Enable Beholder telemetry.
          Enabled: false
          # -- Disable TLS for the Beholder client.
          InsecureConnection: false
          # -- Path to the CA certificate file for the Beholder client.
          CACertFile: ""
          # -- gRPC endpoint for the Beholder client to send data to the collector.
          OtelExporterGRPCEndpoint: ""
          # -- HTTP endpoint for the Beholder client to send data to the collector.
          OtelExporterHTTPEndpoint: ""
          # -- Enable log streaming to the collector.
          LogStreamingEnabled: false
          # -- Minimum log level to stream to Beholder.
          LogStreamingLevel: info
          # -- Interval to scrape metrics, in seconds.
          MetricReaderInterval: 60
          # -- Ratio of traces to sample.
          TraceSampleRatio: 0.1
          # -- Timeout for a batch of traces, in seconds.
          TraceBatchTimeout: 5
          # -- Extra labels to add during OTel transmission.
          TelemetryAttributes: {}
          # env: production

  evm:
    # If your RPC endpoints are not secrets, you can simply configure them here, directly. Otherwise, see `.verifier.secrets.evm` below on how to configure them as a secret.
    config:
      # -- RPC and finality settings per EVM chain, keyed by chain selector. Each node takes either
      #    `http_url`/`ws_url` or `httpUrlRemoteRef`/`wsUrlRemoteRef`, depending on
      #    `verifier.secrets.evm.type` below.
      #    Note: the map keys must be strings, wrapped in quotes.
      chains: {}
      # "1":
      #   #    Number of blocks required before a head is considered final. 0 enables finality-tag
      #   #    mode; a positive value uses confirmation-depth mode.
      #   finality_depth: 0
      #   #    Retry cadence for TXM v2, as a Go duration string. This is not the chain's actual block
      #   #    time. 0 uses the standalone default; non-zero values must be at least 2 seconds.
      #   txm_block_time: "2s"
      #   # RPC endpoints used to reach this chain.
      #   nodes:
      #     - name: node-1
      #       order: 1
      #       # `http_url`/`ws_url` are used directly when `verifier.secrets.evm.type` is `values`.
      #       http_url: "http://rpc-url.com"
      #       ws_url: "ws://rpc-url.com"
      #       # `httpUrlRemoteRef`/`wsUrlRemoteRef` are used when `verifier.secrets.evm.type` is `externalSecret`.
      #       # httpUrlRemoteRef:
      #       #   key: /some/path/for/chain-1-node-1-http-url
      #       # wsUrlRemoteRef:
      #       #   key: /some/path/for/chain-1-node-1-ws-url

  configMap:
    # -- Annotations to add to the verifier ConfigMap.
    annotations: {}
    # -- Labels to add to the verifier ConfigMap.
    labels: {}

  secrets:
    app:
      # -- Annotations to add to the verifier app Secret.
      annotations: {}
      # -- Labels to add to the verifier app Secret.
      labels: {}

      # -- Secret provisioning strategy: `externalSecret`, `existingSecret`, `gcpSecretStore`, `awsSecretStore`, or `azureKeyVault`.
      #    Configure the values below for the chosen type.
      type: externalSecret

      existingSecret:
        # -- Name of an existing Kubernetes Secret to use as the app secret.
        name: ""
        # -- Key inside the existing Secret that holds the secrets file.
        key: "secrets.toml"

      externalSecret:
        # -- Name of the ExternalSecret resource to create.
        name: ""
        # -- SecretStore reference for the ExternalSecret.
        #    See [SecretStoreRef](https://external-secrets.io/latest/api/spec/#external-secrets.io/v1.SecretStoreRef).
        secretStoreRef:
          name: ""
          kind: ClusterSecretStore

        # -- RemoteRef for the database URL secret.
        #    See [RemoteRef](https://external-secrets.io/latest/api/spec/#external-secrets.io/v1.ExternalSecretDataRemoteRef).
        dbUrlRemoteRef: {}

      # -- GCP Secret Manager, mounted via the [Secret Manager add-on for the Secrets Store CSI Driver](https://docs.cloud.google.com/secret-manager/docs/secret-manager-managed-csi-component).
      #    Requires the add-on enabled on the GKE cluster and Workload Identity Federation configured for `verifier.serviceAccount` as described in
      #    [Configure Workload Identity](https://docs.cloud.google.com/secret-manager/docs/secret-manager-managed-csi-component#configure-workload-identity).
      gcpSecretStore:
        secretProviderClass:
          # -- Name of the SecretProviderClass resource to create.
          name: ""
        # -- Fully-qualified GCP Secret Manager secret version resource name, e.g. `projects/<project>/secrets/<secret>/versions/latest`.
        secretVersionResourceName: ""

      # -- AWS Secrets Manager, mounted via the [AWS Secrets and Configuration Provider (ASCP)](https://github.com/aws/secrets-store-csi-driver-provider-aws)
      #    for the Secrets Store CSI Driver. Requires the ASCP installed on the cluster and either
      #    IRSA or EKS Pod Identity configured for `verifier.serviceAccount`.
      #    For IRSA: annotate the ServiceAccount with `eks.amazonaws.com/role-arn`.
      #    For EKS Pod Identity: create a Pod Identity association via the EKS console/CLI; set `usePodIdentity: true`.
      awsSecretStore:
        secretProviderClass:
          # -- Name of the SecretProviderClass resource to create.
          name: ""
        # -- AWS Secrets Manager secret name or full ARN holding the pre-built `secrets.toml`.
        secretName: ""
        # -- AWS region where the secret lives. If omitted, the ASCP infers it from the node's
        #    `topology.kubernetes.io/region` label (adds per-mount overhead on large clusters).
        region: ""
        # -- Set to `true` to use EKS Pod Identity instead of IRSA for AWS credential retrieval.
        usePodIdentity: false

      # -- Azure Key Vault, mounted via the [Azure Key Vault provider for the Secrets Store CSI Driver](https://azure.github.io/secrets-store-csi-driver-provider-azure/).
      #    Requires the provider installed on the AKS cluster and either
      #    Workload Identity or Azure AD Pod Identity configured for `verifier.serviceAccount`.
      #    For Workload Identity: annotate the ServiceAccount with `azure.workload.identity/client-id` and set `clientId` below.
      #    For Pod Identity: create an AzureIdentityBinding and set `usePodIdentity: true`.
      #    Note: Workload Identity also requires the `azure.workload.identity/use: "true"` pod label, set via `verifier.podLabels`.
      azureKeyVault:
        secretProviderClass:
          # -- Name of the SecretProviderClass resource to create.
          name: ""
        # -- Azure Key Vault name (the short name, not the full URI).
        keyvaultName: ""
        # -- Name of the Key Vault secret holding the pre-built `secrets.toml`.
        secretName: ""
        # -- Azure AD tenant ID where the Key Vault lives.
        tenantId: ""
        # -- Client ID of the Azure AD application or user-assigned managed identity to use for Workload Identity.
        #    Leave empty when using Pod Identity (`usePodIdentity: true`).
        clientId: ""
        # -- Set to `true` to use Azure AD Pod Identity instead of Workload Identity for credential retrieval.
        usePodIdentity: false

    bootstrap:
      # -- Annotations to add to the verifier bootstrap Secret.
      annotations: {}
      # -- Labels to add to the verifier bootstrap Secret.
      labels: {}

      # -- Keystore backend: `postgres` or `kms`.
      keystoreBackend: postgres

      kms:
        # -- AWS KMS key ID for the ECDSA key (only when `keystoreBackend` is `kms`).
        ecdsaKeyId: ""  # "arn:aws:kms:us-east-1:...:key/abc123-..."
        # -- AWS KMS key ID for the Ed25519 key (only when `keystoreBackend` is `kms`).
        ed25519KeyId: ""  # "arn:aws:kms:us-east-1:...:key/def456-..."

      # -- Secret provisioning strategy: `externalSecret`, `existingSecret`, `gcpSecretStore`, `awsSecretStore`, or `azureKeyVault`.
      #    Configure the values below for the chosen type.
      type: externalSecret

      existingSecret:
        # -- Name of an existing Kubernetes Secret to use as the bootstrap secret.
        name: ""
        # -- Key inside the existing Secret that holds the secrets file.
        key: "secrets.toml"

      externalSecret:
        # -- Name of the ExternalSecret resource to create.
        name: ""
        # -- SecretStore reference for the ExternalSecret.
        #    See [SecretStoreRef](https://external-secrets.io/latest/api/spec/#external-secrets.io/v1.SecretStoreRef).
        secretStoreRef:
          name: ""
          kind: ClusterSecretStore

        # -- RemoteRef for the database URL secret.
        #    See [RemoteRef](https://external-secrets.io/latest/api/spec/#external-secrets.io/v1.ExternalSecretDataRemoteRef).
        dbUrlRemoteRef: {}

        # -- RemoteRef for the keystore password (only when `keystoreBackend` is `postgres`).
        #    See [RemoteRef](https://external-secrets.io/latest/api/spec/#external-secrets.io/v1.ExternalSecretDataRemoteRef).
        keystorePasswordRemoteRef: {}

      # -- GCP Secret Manager, mounted via the [Secret Manager add-on for the Secrets Store CSI Driver](https://docs.cloud.google.com/secret-manager/docs/secret-manager-managed-csi-component).
      #    Requires the add-on enabled on the GKE cluster and Workload Identity Federation configured for `verifier.serviceAccount` as described in
      #    [Configure Workload Identity](https://docs.cloud.google.com/secret-manager/docs/secret-manager-managed-csi-component#configure-workload-identity).
      gcpSecretStore:
        secretProviderClass:
          # -- Name of the SecretProviderClass resource to create.
          name: ""
        # -- Fully-qualified GCP Secret Manager secret version resource name, e.g. `projects/<project>/secrets/<secret>/versions/latest`.
        secretVersionResourceName: ""

      # -- AWS Secrets Manager, mounted via the [AWS Secrets and Configuration Provider (ASCP)](https://github.com/aws/secrets-store-csi-driver-provider-aws)
      #    for the Secrets Store CSI Driver. Requires the ASCP installed on the cluster and either
      #    IRSA or EKS Pod Identity configured for `verifier.serviceAccount`.
      #    For IRSA: annotate the ServiceAccount with `eks.amazonaws.com/role-arn`.
      #    For EKS Pod Identity: create a Pod Identity association via the EKS console/CLI; set `usePodIdentity: true`.
      awsSecretStore:
        secretProviderClass:
          # -- Name of the SecretProviderClass resource to create.
          name: ""
        # -- AWS Secrets Manager secret name or full ARN holding the pre-built `secrets.toml`.
        secretName: ""
        # -- AWS region where the secret lives. If omitted, the ASCP infers it from the node's
        #    `topology.kubernetes.io/region` label (adds per-mount overhead on large clusters).
        region: ""
        # -- Set to `true` to use EKS Pod Identity instead of IRSA for AWS credential retrieval.
        usePodIdentity: false

      # -- Azure Key Vault, mounted via the [Azure Key Vault provider for the Secrets Store CSI Driver](https://azure.github.io/secrets-store-csi-driver-provider-azure/).
      #    Requires the provider installed on the AKS cluster and either
      #    Workload Identity or Azure AD Pod Identity configured for `verifier.serviceAccount`.
      #    For Workload Identity: annotate the ServiceAccount with `azure.workload.identity/client-id` and set `clientId` below.
      #    For Pod Identity: create an AzureIdentityBinding and set `usePodIdentity: true`.
      #    Note: Workload Identity also requires the `azure.workload.identity/use: "true"` pod label, set via `verifier.podLabels`.
      azureKeyVault:
        secretProviderClass:
          # -- Name of the SecretProviderClass resource to create.
          name: ""
        # -- Azure Key Vault name (the short name, not the full URI).
        keyvaultName: ""
        # -- Name of the Key Vault secret holding the pre-built `secrets.toml`.
        secretName: ""
        # -- Azure AD tenant ID where the Key Vault lives.
        tenantId: ""
        # -- Client ID of the Azure AD application or user-assigned managed identity to use for Workload Identity.
        #    Leave empty when using Pod Identity (`usePodIdentity: true`).
        clientId: ""
        # -- Set to `true` to use Azure AD Pod Identity instead of Workload Identity for credential retrieval.
        usePodIdentity: false

    evm:
      # -- Annotations to add to the verifier evm Secret.
      annotations: {}
      # -- Labels to add to the verifier evm Secret.
      labels: {}

      # -- Provisioning strategy: the default, `values`, uses .verifier.evm.config to render this as a simple ConfigMap.
      #    However, it's common for RPC endpoints to be secrets. In that case, use one of `externalSecret`, `existingSecret`, `gcpSecretStore`,
      #    `awsSecretStore`, or `azureKeyVault` to configure this as a secret instead.
      type: values

      existingSecret:
        # -- Name of an existing Kubernetes Secret to use as the evm secret.
        name: ""
        # -- Key inside the existing Secret that holds the secrets file.
        key: "secrets.toml"

      externalSecret:
        # -- Name of the ExternalSecret resource to create.
        name: ""
        # -- SecretStore reference for the ExternalSecret. The actual per-URL RemoteRefs live on each
        #    `verifier.evm.config.chains[].nodes[]` entry instead, as `httpUrlRemoteRef`/`wsUrlRemoteRef`.
        #    See [SecretStoreRef](https://external-secrets.io/latest/api/spec/#external-secrets.io/v1.SecretStoreRef).
        secretStoreRef:
          name: ""
          kind: ClusterSecretStore

      # -- GCP Secret Manager, mounted via the [Secret Manager add-on for the Secrets Store CSI Driver](https://docs.cloud.google.com/secret-manager/docs/secret-manager-managed-csi-component).
      #    Requires the add-on enabled on the GKE cluster and Workload Identity Federation configured for `verifier.serviceAccount` as described in
      #    [Configure Workload Identity](https://docs.cloud.google.com/secret-manager/docs/secret-manager-managed-csi-component#configure-workload-identity).
      gcpSecretStore:
        secretProviderClass:
          # -- Name of the SecretProviderClass resource to create.
          name: ""
        # -- Fully-qualified GCP Secret Manager secret version resource name holding a pre-built
        #    `secrets.toml`, e.g. `projects/<project>/secrets/<secret>/versions/latest`.
        secretVersionResourceName: ""

      # -- AWS Secrets Manager, mounted via the [AWS Secrets and Configuration Provider (ASCP)](https://github.com/aws/secrets-store-csi-driver-provider-aws)
      #    for the Secrets Store CSI Driver. Requires the ASCP installed on the cluster and either
      #    IRSA or EKS Pod Identity configured for `verifier.serviceAccount`.
      awsSecretStore:
        secretProviderClass:
          # -- Name of the SecretProviderClass resource to create.
          name: ""
        # -- AWS Secrets Manager secret name or full ARN holding the pre-built `secrets.toml`.
        secretName: ""
        # -- AWS region where the secret lives. If omitted, the ASCP infers it from the node's
        #    `topology.kubernetes.io/region` label (adds per-mount overhead on large clusters).
        region: ""
        # -- Set to `true` to use EKS Pod Identity instead of IRSA for AWS credential retrieval.
        usePodIdentity: false

      # -- Azure Key Vault, mounted via the [Azure Key Vault provider for the Secrets Store CSI Driver](https://azure.github.io/secrets-store-csi-driver-provider-azure/).
      #    Requires the provider installed on the AKS cluster and either
      #    Workload Identity or Azure AD Pod Identity configured for `verifier.serviceAccount`.
      #    For Workload Identity: annotate the ServiceAccount with `azure.workload.identity/client-id` and set `clientId` below.
      #    For Pod Identity: create an AzureIdentityBinding and set `usePodIdentity: true`.
      #    Note: Workload Identity also requires the `azure.workload.identity/use: "true"` pod label, set via `verifier.podLabels`.
      azureKeyVault:
        secretProviderClass:
          # -- Name of the SecretProviderClass resource to create.
          name: ""
        # -- Azure Key Vault name (the short name, not the full URI).
        keyvaultName: ""
        # -- Name of the Key Vault secret holding the pre-built `secrets.toml`.
        secretName: ""
        # -- Azure AD tenant ID where the Key Vault lives.
        tenantId: ""
        # -- Client ID of the Azure AD application or user-assigned managed identity to use for Workload Identity.
        #    Leave empty when using Pod Identity (`usePodIdentity: true`).
        clientId: ""
        # -- Set to `true` to use Azure AD Pod Identity instead of Workload Identity for credential retrieval.
        usePodIdentity: false

  # -- Override the container entrypoint. See [command](https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/).
  command: []
  # - /bin/verifier

  # -- Arguments passed to the container entrypoint. See [args](https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/).
  args: []
  # - --config=/etc/config.toml

  # -- Container lifecycle hooks (postStart / preStop). See [lifecycle](https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/).
  lifecycle: {}
  # preStop:
  #   exec:
  #     command: ["/bin/sh", "-c", "sleep 5"]

  # -- Extra environment variables for the verifier container. See [env](https://kubernetes.io/docs/tasks/inject-data-application/define-environment-variable-container/).
  env: []

  # -- Extra envFrom sources (ConfigMaps / Secrets) for the verifier container. See [envFrom](https://kubernetes.io/docs/tasks/inject-data-application/define-environment-variable-container/).
  envFrom: []

  # -- Init containers prepended to the verifier pod. See [init containers](https://kubernetes.io/docs/concepts/workloads/pods/init-containers/).
  extraInitContainers: []
  # - name: init
  #   image: busybox

  # -- Sidecar containers appended to the verifier pod. See [sidecar containers](https://kubernetes.io/docs/concepts/workloads/pods/#pod-templates).
  #    You can use these as a means of deploying policy hooks, but most of the time you'll want a separate deployment.
  extraContainers: []
  # - name: sidecar
  #   image: busybox

  serviceAccount:
    # -- Create a dedicated ServiceAccount for the verifier, usually used for OIDC auth with your cloud provider.
    create: true
    # -- Annotations to add to the ServiceAccount.
    #    For GKE Workload Identity Federation (required by `verifier.secrets.*.gcpSecretStore`),
    #    set `iam.gke.io/gcp-service-account` to the Google service account bound to this KSA.
    #    For AWS IRSA (required by `verifier.secrets.*.awsSecretStore` with `usePodIdentity: false`),
    #    set `eks.amazonaws.com/role-arn` to the IAM role ARN that can read the secrets.
    #    For Azure Workload Identity (required by `verifier.secrets.*.azureKeyVault` with `usePodIdentity: false`),
    #    set `azure.workload.identity/client-id` to the Azure AD application or managed identity client ID.
    annotations: {}
    # -- Labels to add to the ServiceAccount.
    labels: {}
    # -- Use an existing ServiceAccount instead of creating one; ignored when `create` is true.
    name: ""
    # -- Mount the service account token into pods. See [automountServiceAccountToken](https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/#opt-out-of-api-credential-automounting).
    #    By default, not needed, since this application doesn't use the Kuberentes API.
    automountServiceAccountToken: false

  # -- Annotations to add to the verifier Deployment object.
  annotations: {}
  # -- Labels to add to the verifier Deployment object.
  labels: {}

  # -- Annotations to add to the verifier pods.
  podAnnotations: {}
  # -- Labels to add to the verifier pods.
  podLabels: {}

  networkPolicy:
    # -- Enable a NetworkPolicy for the verifier. See [NetworkPolicy](https://kubernetes.io/docs/concepts/services-networking/network-policies/).
    enabled: false
    # -- Annotations to add to the NetworkPolicy.
    annotations: {}
    # -- Labels to add to the NetworkPolicy.
    labels: {}
    # -- Ingress rules for the NetworkPolicy.
    #    Each rule's `ports` defaults to the verifier's own ports when omitted.
    #    See [NetworkPolicy](https://kubernetes.io/docs/concepts/services-networking/network-policies/).
    ingress:
      - from:
          - podSelector: {}

  # -- CPU/memory resource requests and limits for the verifier container. See [resources](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/).
  resources: {}
    # limits:
    #   cpu: 1500m
    #   memory: 1Gi
    # requests:
    #   cpu: 1
    #   memory: 512Mi

  # -- CPU/memory resource requests and limits for the entire pod. See [resources](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/).
  podResources: {}
    # limits:
    #   cpu: 2
    #   memory: 2Gi
    # requests:
    #   cpu: 1
    #   memory: 1Gi

  # -- Liveness probe for the verifier container. See [probes](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/).
  livenessProbe:
    httpGet:
      path: /health
      port: bootstrap-info
    initialDelaySeconds: 15
    periodSeconds: 15
    failureThreshold: 10

  # -- Readiness probe for the verifier container. See [probes](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/).
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  # -- Startup probe for the verifier container. See [probes](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/).
  startupProbe:
    # httpGet:
    #   path: /ready
    #   port: bootstrap-info
    # periodSeconds: 5
    # failureThreshold: 30

  # -- Extra volumes appended to the verifier pod. See [volumes](https://kubernetes.io/docs/tasks/configure-pod-container/configure-volume-storage/).
  extraVolumes: []
  # - name: extra-ca-bundle
  #   configMap:
  #     name: extra-ca-bundle

  # -- Extra volume mounts appended to the verifier container. See [volumes](https://kubernetes.io/docs/tasks/configure-pod-container/configure-volume-storage/).
  extraVolumeMounts: []
  # - name: extra-ca-bundle
  #   mountPath: /etc/ssl/certs/extra-ca.pem
  #   subPath: extra-ca.pem
  #   readOnly: true

  # -- Node selector for pod scheduling. See [nodeSelector](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector).
  nodeSelector: {}
  # -- Tolerations for pod scheduling. See [tolerations](https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/).
  tolerations: []
  # -- Affinity rules for pod scheduling. See [affinity](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity).
  affinity: {}

  # -- Security context applied at the pod level. See [podSecurityContext](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/).
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  # -- Security context applied at the container level. See [securityContext](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/).
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # -- Share a single process namespace across all containers in the pod. See [shareProcessNamespace](https://kubernetes.io/docs/tasks/configure-pod-container/share-process-namespace/).
  shareProcessNamespace: false
