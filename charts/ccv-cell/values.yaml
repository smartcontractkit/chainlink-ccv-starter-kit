global:
  image:
    registry: public.ecr.aws
  imagePullSecrets: []
  labels: {}

nameOverride: ""
fullnameOverride: ""


verifier:
  enabled: true

  serviceAccount:
    create: true
    annotations: {}
    labels: {}
    name: ""

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  image:
    registry: ""        # overrides global.image.registry
    repository: w0i8p0z9/chainlink-ccv-verifier
    tag: "PLACEHOLDER"             # mutually exclusive with digest
    digest: ""          # sha256:... — mutually exclusive with tag
    pullPolicy: IfNotPresent

  # Deployment object's own annotations/labels.
  annotations: {}
  labels: {}

  # Pod template's own annotations/labels (distinct from the Deployment
  # object's above).
  podAnnotations: {}
  podLabels: {}

  configMap:
    annotations: {}
    labels: {}

  ports:
    bootstrapInfo: 9988

  networkPolicy:
    enabled: false
    annotations: {}
    labels: {}
    # Each rule's `ports` is optional; if omitted it defaults to the
    # verifier's own ports (http + bootstrapInfo).
    ingress:
      # Same-namespace only: a blank podSelector with no namespaceSelector
      # admits only pods in this namespace.
      - from:
          - podSelector: {}

  resources: {}
    # limits:
    #   cpu: 1500m
    #   memory: 1Gi
    # requests:
    #   cpu: 1
    #   memory: 512Mi

  podResources: {}
    # limits:
    #   cpu: 2
    #   memory: 2Gi
    # requests:
    #   cpu: 1
    #   memory: 1Gi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Appended as-is to the container's volumeMounts / the Pod's volumes —
  # e.g. to mount an extra cert, a custom CA bundle, or an emptyDir.
  extraVolumeMounts: []
  # - name: extra-ca-bundle
  #   mountPath: /etc/ssl/certs/extra-ca.pem
  #   subPath: extra-ca.pem
  #   readOnly: true
  extraVolumes: []
  # - name: extra-ca-bundle
  #   configMap:
  #     name: extra-ca-bundle

  # Sidecar containers appended to the pod's containers list.
  extraContainers: []
  # - name: sidecar
  #   image: busybox

  # Init containers run before the main container starts.
  extraInitContainers: []
  # - name: init
  #   image: busybox

  # Share a single process namespace between all containers in the pod.
  shareProcessNamespace: false

  env: []

  envFrom: []

  livenessProbe:
    httpGet:
      path: /health/live
      port: health
    initialDelaySeconds: 15
    periodSeconds: 15
    failureThreshold: 10

  readinessProbe:
    httpGet:
      path: /health/ready
      port: bootstrap-info
    initialDelaySeconds: 5
    periodSeconds: 10

  startupProbe:
    # httpGet:
    #   path: /health/ready
    #   port: health
    # initialDelaySeconds: 5
    # periodSeconds: 5
    # failureThreshold: 20

  service:
    type: ClusterIP
    annotations: {}
    labels: {}
    ports:
      http: 8100

  config: {}

  secrets:
    app:
      annotations: {}
      labels: {}

      type: externalSecret

      existingSecret:
        name: ""
        key: "secrets.toml"

      externalSecret:
        name: ""
        secretStoreRef: { name: "", kind: ClusterSecretStore }

        dbUrlRemoteRef: {}

        aggregators: []
          # - secretName: aggregator_0
          #   apiKeyRemoteRef:
          #     key: /some/path/for/aggregator-0-api
          #   secretKeyRemoteRef:
          #     key: /some/path/for/aggregator-0-secret
          # - secretName: aggregator_1
          #   apiKeyRemoteRef:
          #     key: /some/path/for/aggregator-1-api
          #   secretKeyRemoteRef:
          #     key: /some/path/for/aggregator-1-secret

    bootstrap:
      annotations: {}
      labels: {}

      keystoreBackend: postgres

      # only if keystoreBackend is kms
      kms:
        ecdsaKeyId: ""  # "arn:aws:kms:us-east-1:...:key/abc123-..."
        ed25519KeyId: ""  # "arn:aws:kms:us-east-1:...:key/def456-..."

      type: externalSecret

      existingSecret:
        name: ""
        key: "secrets.toml"

      externalSecret:
        name: ""
        secretStoreRef:
          name: ""
          kind: ClusterSecretStore

        dbUrlRemoteRef: {}

        # only if keystoreBackend is postgres
        keystorePasswordRemoteRef: {}

aggregator:
  enabled: true

  serviceAccount:
    create: true
    annotations: {}
    labels: {}
    name: ""

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  image:
    registry: ""        # overrides global.image.registry
    repository: w0i8p0z9/chainlink-ccv-aggregator
    tag: "PLACEHOLDER"             # mutually exclusive with digest
    digest: ""          # sha256:... — mutually exclusive with tag
    pullPolicy: IfNotPresent

  ports:
    grpc: 50051     # [server].address — write path (peer pushes) + read path (indexer)
    health: 8080    # [healthCheck].port — /health, /health/live, /health/ready

  resources: {}
    # limits:
    #   cpu: 1500m
    #   memory: 1Gi
    # requests:
    #   cpu: 1
    #   memory: 512Mi

  podResources: {}
    # limits:
    #   cpu: 2
    #   memory: 2Gi
    # requests:
    #   cpu: 1
    #   memory: 1Gi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Appended as-is to the container's volumeMounts / the Pod's volumes —
  # e.g. to mount an extra cert, a custom CA bundle, or an emptyDir.
  extraVolumeMounts: []
  # - name: extra-ca-bundle
  #   mountPath: /etc/ssl/certs/extra-ca.pem
  #   subPath: extra-ca.pem
  #   readOnly: true
  extraVolumes: []
  # - name: extra-ca-bundle
  #   configMap:
  #     name: extra-ca-bundle

  # Sidecar containers appended to the pod's containers list.
  extraContainers: []
  # - name: sidecar
  #   image: busybox

  # Init containers run before the main container starts.
  extraInitContainers: []
  # - name: init
  #   image: busybox

  # Share a single process namespace between all containers in the pod.
  shareProcessNamespace: false

  # Deployment object's own annotations/labels.
  annotations: {}
  labels: {}

  # Pod template's own annotations/labels (distinct from the Deployment
  # object's above).
  podAnnotations: {}
  podLabels: {}

  configMap:
    annotations: {}
    labels: {}

  # Renders aggregator/config.documented.toml.
  config:
    server:
      address: ":50051"

    clients: ""
    # example:
    # clients: |
    #     [[clients]]
    #     name = "partner-op-verifier"

  secrets:
    app:
      annotations: {}
      labels: {}

      type: externalSecret

      existingSecret:
        name: ""
        key: "secrets.toml"

      externalSecret:
        name: ""
        secretStoreRef:
          name: ""
          kind: ClusterSecretStore

        # remoteRef snippet of external secret data section
        # see https://external-secrets.io/latest/api/externalsecret/#example
        storageUrlRemoteRef: {}
          # key: /some/path/for/storage-url/

        clients: []
          # - clientId: client-0
          #   apiKeyRemoteRef:
          #     key: /some/path/for/client-0-api
          #   secretKeyRemoteRef:
          #     key: /some/path/for/client-0-secret
          # - clientId: client-2
          #   apiKeyRemoteRef:
          #     key: /some/path/for/client-1-api
          #   secretKeyRemoteRef:
          #     key: /some/path/for/client-1-secret

  env: []

  envFrom: []

  livenessProbe:
    httpGet:
      path: /health/live
      port: health
    initialDelaySeconds: 15
    periodSeconds: 15
    failureThreshold: 10

  readinessProbe:
    httpGet:
      path: /health/ready
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10

  startupProbe:
    # httpGet:
    #   path: /health/ready
    #   port: health
    # initialDelaySeconds: 5
    # periodSeconds: 5
    # failureThreshold: 20

  # type is not restricted to ClusterIP — set it to NodePort/LoadBalancer if
  # your ingress path doesn't front it with its own load balancer (e.g. no
  # Ingress/HTTPRoute at all, or a controller that talks to NodePort/LB
  # Services directly instead of ClusterIP).
  service:
    type: ClusterIP
    clusterIP: ""       # only meaningful when type is ClusterIP
    annotations: {}
    labels: {}

  # Network exposure (from the CCV requirements doc's "Network exposure"
  # section): the aggregator's read endpoint is deliberately public with no
  # authentication or IP allowlisting — that's by design, not an oversight
  # (HMAC secures the write path; reads are meant to be open to the
  # indexer). This kit does not provision WAF/DDoS protection itself; that
  # is the operator's responsibility on whatever sits in front of `host`
  # below. If you add rate limiting there, it MUST NOT throttle below the
  # indexer's client defaults — 10s timeout, 5 rps — and must not present it
  # with interactive challenges (CAPTCHA/JS), since it's an automated client
  # that can't solve them. `host` is this aggregator's identity: it's handed
  # to the indexer at onboarding and to every peer verifier's
  # config.aggregators[].address, so treat it as stable — rotating it breaks
  # everyone pointed at the old value. It must be served over a trusted TLS
  # certificate (tls.secretName below) with HTTP/2 end to end — see
  # ingress.annotations' comment for why the controller-specific wiring for
  # that isn't hardcoded here.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    labels: {}
    host: "example.com"
    tls:
      enabled: false
      secretName: ""

  # Gateway API alternative to ingress above — use whichever matches your
  # cluster's controller (mesh vs. HTTP/2-aware ingress controller is a
  # per-cloud design-proposal decision, same as ingress's annotations).
  # Mutually independent of ingress.enabled; enable one, the other, both, or
  # neither. Same obligations apply as documented on ingress above (WAF/rate
  # limiting floor, hostname stability, TLS, HTTP/2 end to end) — TLS
  # termination for a Gateway-API path lives on the Gateway resource itself,
  # which is out of this chart's scope (no load balancer/Gateway objects are
  # created here), so wire it there.
  httpRoute:
    enabled: false
    annotations: {}
    labels: {}
    parentRefs: []
    # - group: gateway.networking.k8s.io
    #   kind: Gateway
    #   name: gateway
    #   namespace: istio-ingress
    hostnames: []
    # - ccv-aggregator.nethermind.example.com

  networkPolicy:
    enabled: false
    annotations: {}
    labels: {}
    # If you enable this policy you MUST add a rule that allows traffic from
    # your ingress/gateway controller (e.g. its namespace or pod selector),
    # otherwise the public gRPC path becomes unreachable.
    # Each rule's `ports` is optional; if omitted it defaults to the
    # aggregator's own ports (grpc + health).
    ingress:
      # Same-namespace only: a blank podSelector with no namespaceSelector
      # admits only pods in this namespace.
      - from:
          - podSelector: {}
